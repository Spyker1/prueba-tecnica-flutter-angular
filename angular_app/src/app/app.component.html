<header class="admin-topbar">
  <div class="topbar-container">
    <div class="brand-group">
      <a routerLink="/" class="brand-link">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5" />
          </svg>
        </div>
        <span class="brand-name">Portal de Pedidos</span>
      </a>
    </div>

    <nav class="topbar-nav" aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <span>Órdenes</span>
      </a>
    </nav>

    <div class="topbar-meta">
      <span class="api-status-badge">
        <span class="status-dot"></span>
        API Conectada
      </span>
    </div>
  </div>
</header>

<main class="app-main-content">
  <router-outlet />
</main>
